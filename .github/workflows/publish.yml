name: daily-publish
# 하루 3번 (KST): 08:30 매거진 캐러셀 / 12:30 매거진 릴스 / 21:00 웹툰 캐러셀 — 그날 날짜 게시물. (2026-11-10 스토리 → 웹툰)
# 막는 장치: KILL_SWITCH 파일, 발행 직전 관문 재검사(check_post.py), publish-log.csv 중복 방지.
on:
  schedule:
    - cron: "30 23 * * *"   # 08:30 KST carousel (전날 23:30 UTC)
    - cron: "30 3 * * *"    # 12:30 KST reel
    - cron: "0 12 * * *"    # 21:00 KST webtoon
    - cron: "30 0 11 11 *"  # 일회성: 2026-11-11 09:30 KST — 11-10 웹툰 재발행(차단으로 밀림). 끝나면 지울 것
  workflow_dispatch:
    inputs:
      date:
        description: "발행할 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
      kind:
        description: "carousel / reel / webtoon / story / both"
        required: false
        default: both
permissions:
  contents: write
concurrency:
  group: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: publish
        run: |
          D="${{ github.event.inputs.date }}"
          case "${{ github.event.schedule }}" in
            "30 23 * * *") K=carousel ;;
            "30 3 * * *")  K=reel ;;
            "0 12 * * *")  K=webtoon ;;
            "30 0 11 11 *") K=webtoon; D=2026-11-10 ;;
            *)             K="${{ github.event.inputs.kind }}"; K="${K:-both}" ;;
          esac
          echo "kind=$K"
          python3 scripts/publish.py --kind "$K" ${D:+--date "$D"}
      - name: save log
        if: always()
        run: |
          git config user.name "d280-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A publish-log.csv posts
          git diff --cached --quiet || (git commit -m "publish log $(date +%F)" && git push)
